<div class="container tools-header">
  <h1 data-i18n="scan.h1">QR Code Scanner</h1>
  <p data-i18n="scan.p">شغّل الكاميرا أو ارفع صورة فيها كود QR، وهيبان لك المحتوى فورًا — القراءة كلها بتتم جوه متصفحك.</p>
</div>

<div class="container" style="padding-bottom:80px;">
  <div class="scanner-wrap">

    <div class="scanner-video-wrap" id="videoWrap">
      <div class="placeholder" id="videoPlaceholder">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M9 7V5.5A1.5 1.5 0 0110.5 4h1A1.5 1.5 0 0113 5.5V7" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="12.5" r="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M17 10l4-2v9l-4-2" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span data-i18n="scan.placeholder">الكاميرا مقفولة دلوقتي</span>
      </div>
      <video id="video" playsinline muted hidden></video>
      <div class="viewfinder" id="viewfinder" hidden></div>
    </div>
    <canvas id="captureCanvas" hidden></canvas>

    <div class="scanner-actions">
      <button class="btn btn-primary" id="startBtn" type="button" data-i18n="scan.start">تشغيل الكاميرا</button>
      <button class="btn btn-ghost-dark" id="stopBtn" type="button" hidden data-i18n="scan.stop">إيقاف الكاميرا</button>
      <button class="btn btn-ghost-dark" id="torchBtn" type="button" hidden aria-pressed="false" data-i18n="scan.torch.on">تشغيل الفلاش</button>
    </div>
    <p class="hint" id="camHint" style="margin-top:10px; text-align:center;"></p>

    <div class="scanner-divider" data-i18n="scan.divider">أو</div>

    <div class="scanner-upload">
      <label class="upload-btn" for="imgInput" style="display:inline-block;" data-i18n="scan.upload">ارفع صورة فيها كود QR</label>
      <input type="file" id="imgInput" accept="image/*" hidden>
    </div>

    <div class="scan-result" id="scanResult" hidden>
      <span class="type-badge" id="resultType" data-i18n="scan.result.default">نتيجة المسح</span>
      <dl id="resultFields"></dl>
      <div class="scan-raw" id="resultRaw"></div>
      <div class="scan-result-actions" id="resultActions"></div>
    </div>

    <div class="scan-history" id="historyWrap" hidden>
      <h3 data-i18n="scan.history.h3">آخر الأكواد اللي اتقرت</h3>
      <ul id="historyList"></ul>
      <div class="hero-actions" style="margin-top:14px;">
        <button class="btn btn-ghost-dark" id="exportHistoryBtn" type="button" data-i18n="scan.history.export">تصدير السجل (CSV)</button>
        <button class="btn btn-ghost-dark" id="clearHistoryBtn" type="button" data-i18n="scan.history.clear">مسح السجل</button>
      </div>
    </div>
  </div>
</div>
